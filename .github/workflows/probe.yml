name: Probe (temporär)
on:
  pull_request:
    paths: [.github/probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q global_macro_data requests pandas && python .github/probe/probe.py
