name: Probe (temporär)
on:
  push:
    branches: [claude/konjunkturwolf-t3mblu]
    paths: [.github/probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests pandas openpyxl
      - run: python .github/probe/probe.py
