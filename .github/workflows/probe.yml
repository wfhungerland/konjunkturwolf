name: Probe (temporär)
on:
  push:
    branches: [claude/konjunkturwolf-t3mblu]
    paths: [.github/probe/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -e .
      - run: python .github/probe/probe.py
      - run: |
          git config user.name "konjunkturwolf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git commit -m "Daten: Sahm-Reihen berechnet" && git push origin HEAD:claude/konjunkturwolf-t3mblu
