name: Probe (temporär)
on:
  pull_request:
    paths: [.github/probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pandas requests && python .github/probe/probe.py
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
