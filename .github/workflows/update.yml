name: Daten aktualisieren

on:
  schedule:
    - cron: "17 5 * * 1"   # montags 05:17 UTC
  workflow_dispatch:
  push:
    # nach jedem Merge neu bauen und veröffentlichen (Daten-Commits des Bots lösen nichts aus)
    branches: [main]
    paths:
      - series.yaml
      - "konjunkturwolf/**"
      - "data/static/**"
  pull_request:
    paths:
      - series.yaml
      - "konjunkturwolf/**"
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-${{ github.head_ref || github.ref_name }}
  # bei Pull Requests ersetzt ein neuer Push den laufenden Lauf
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Pipeline ausführen
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
        run: python -m konjunkturwolf run --no-cache

      - name: Lauf-Status zusammenfassen
        if: always()
        run: python -m konjunkturwolf summary >> "$GITHUB_STEP_SUMMARY"

      - name: Daten und Excel committen
        # bei Pull Requests nur für Branches dieses Repositorys
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "konjunkturwolf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed output
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          BASE=$(git rev-parse HEAD)
          git fetch --quiet origin "$BRANCH"
          if [ "$BASE" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::warning::Branch $BRANCH wurde während des Laufs geändert; Daten-Commit übersprungen (der nächste Lauf holt das nach)."
            exit 0
          fi
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:$BRANCH"

      - name: Pages-Artefakt hochladen
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dashboard veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
