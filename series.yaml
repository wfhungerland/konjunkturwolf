# Reihen-Katalog von konjunkturwolf
#
# Neue Reihe = ein Eintrag unter "series". Pflichtfelder:
#   id, source, key (ausser bei source: derived), title, unit, frequency,
#   adjustment, block
# Optionale Felder:
#   params      Filter/Abfrageparameter der Quelle (Eurostat: Dimensionen,
#               GENESIS: value_variable, filters, query)
#   link        Direktlink zur Reihe auf der Website der Quelle
#               (fehlt er, wird ein Standardlink erzeugt)
#   chart       Diagramm-ID aus "charts" (mehrere Reihen in einem Diagramm)
#   label       Legendenbeschriftung im Diagramm (Standard: title)
#   style       line | step
#   start       Beginn als ISO-Datum (Standard: defaults.start)
#   note        Hinweis, erscheint im Excel-Blatt Quellen
#   expand      Vervielfacht den Eintrag, z. B. {geo: [DE, FR]};
#               Platzhalter {geo} und {geo_name} in allen Textfeldern
#   derive      Abgeleitete Reihe, z. B. {from: de_cpi, op: yoy_pct}
#
# Frequenzen: D (täglich), M (monatlich), Q (quartalsweise),
#             S (halbjährlich), A (jährlich)
# Quellen:    ecb, bundesbank, eurostat, genesis, derived

defaults:
  start: "2000-01-01"

blocks:
  - id: inflation
    title: Inflation
    sheet: Inflation
  - id: konjunktur
    title: Konjunktur Deutschland
    sheet: Konjunktur DE
  - id: energie
    title: Energie und Preise
    sheet: Energie & Preise
  - id: finanzen
    title: Finanzen und Zinsen
    sheet: Finanzen & Zinsen
  - id: eu
    title: EU-Vergleich
    sheet: EU-Vergleich
  - id: lang
    title: Langfristig (seit 1870)
    sheet: Langfristig
    history: true

# Vergleichsdiagramme: Fokusland hervorgehoben, Vergleichsländer als graue Spanne (Minimum bis Maximum)
comparison:
  focus: [DE, DEU]
  peers: [FR, IT, ES, NL, PL, FRA, ITA, ESP, NLD, POL, GBR, USA]

geo_names:
  DE: Deutschland
  FR: Frankreich
  IT: Italien
  ES: Spanien
  NL: Niederlande
  PL: Polen
  EU27_2020: EU27
  DEU: Deutschland
  FRA: Frankreich
  ITA: Italien
  ESP: Spanien
  NLD: Niederlande
  POL: Polen
  GBR: Vereinigtes Königreich
  USA: USA

# Webseite: je Kernindikator links der lange Rand (seit 1870), rechts der aktuelle Rand (5 Jahre)
panels:
  - id: inflation
    title: Inflation
    left: {chart: lang_infl, title: "Inflation seit 1870, % gg. Vorjahr"}
    right: {series: [de_cpi_yoy, de_hicp_yoy, de_hicp_core_yoy], title: "Inflation aktuell, % gg. Vorjahresmonat", decimals: 1}
  - id: wachstum
    title: Wachstum
    left: {chart: lang_growth, title: "Reales BIP seit 1870, % gg. Vorjahr"}
    right: {chart: de_gdp_contrib, title: "Wachstumsbeiträge aktuell, Pp gg. Vorquartal"}
  - id: arbeit
    title: Arbeitslosigkeit
    left: {chart: lang_unemp, title: "Arbeitslosenquote seit 1870, %"}
    right: {chart: eu_unemp, title: "Erwerbslosenquote (ILO) aktuell, %", decimals: 1}
  - id: zinsen
    title: Zinsen
    left: {chart: lang_ltrate, title: "Langfristiger Zins seit 1870, % p. a."}
    right: {series: [de_bund10_bbk, de_bund2_bbk, ecb_dfr], title: "Zinsen aktuell, % p. a."}

names:
  item:
    P31_S14_S15: Private Konsumausgaben
    P3_S13: Staatskonsum
    P51G: Bruttoanlageinvestitionen
    P52_P53: Vorratsveränderungen
    P6: Exporte
    P7: Importe
  land:
    "01": Schleswig-Holstein
    "02": Hamburg
    "03": Niedersachsen
    "04": Bremen
    "05": Nordrhein-Westfalen
    "06": Hessen
    "07": Rheinland-Pfalz
    "08": Baden-Württemberg
    "09": Bayern
    "10": Saarland
    "11": Berlin
    "12": Brandenburg
    "13": Mecklenburg-Vorpommern
    "14": Sachsen
    "15": Sachsen-Anhalt
    "16": Thüringen

charts:
  de_gdp: {title: "BIP real, Veränderung in %"}
  de_gdp_contrib: {title: "Wachstumsbeiträge zum realen BIP gg. Vorquartal, Prozentpunkte", kind: stacked}
  de_cpi: {title: "Verbraucherpreisindex (VPI), 2020=100"}
  de_cpi_rate: {title: "VPI, % gg. Vorjahresmonat", decimals: 1}
  de_cpi_laender: {title: "VPI der Bundesländer, % gg. Vorjahresmonat", decimals: 1}
  de_cpi_laender_index: {title: "VPI der Bundesländer, 2020=100"}
  de_perceived: {title: "Gefühlte und erwartete Inflation (Verbraucherumfrage)"}
  de_labour_rate: {title: "Arbeitslosenquote (ILO)"}
  de_employment: {title: "Erwerbstätige (Inland)"}
  de_production: {title: "Industrieproduktion und Auftragseingang, Index"}
  de_energy_prices_hh: {title: "Strom- und Gaspreise Haushalte"}
  de_energy_prices_nonhh: {title: "Strom- und Gaspreise Nicht-Haushalte"}
  de_ppi: {title: "Erzeugerpreise gewerblicher Produkte, Index"}
  de_energy_use: {title: "Energieverbrauch Deutschland"}
  ecb_rates: {title: "EZB-Leitzinsen"}
  de_yields: {title: "Renditen deutscher Bundeswertpapiere"}
  de_loans_stock: {title: "Kredite an Unternehmen und Haushalte, Bestand, €Mrd."}
  de_loans_growth: {title: "Kredite an Unternehmen und Haushalte, Wachstum"}
  fx_major: {title: "Wechselkurse: USD, GBP, CHF je Euro"}
  fx_asia: {title: "Wechselkurse: JPY, CNY je Euro"}
  eu_gdp: {title: "BIP real, % gg. Vorjahresquartal"}
  eu_hicp: {title: "HVPI-Inflationsrate, % gg. Vorjahresmonat", decimals: 1}
  eu_unemp: {title: "Arbeitslosenquote (ILO), %"}
  eu_elec_hh: {title: "Strompreise Haushalte, EUR/kWh"}
  eu_elec_nonhh: {title: "Strompreise Nicht-Haushalte, EUR/kWh"}
  lang_infl: {title: "Inflation, % gg. Vorjahr", y_min: -15, y_max: 40, decimals: 1}
  lang_growth: {title: "Reales BIP, % gg. Vorjahr", y_min: -25, y_max: 25}
  lang_debt: {title: "Staatsschulden, % des BIP"}
  lang_unemp: {title: "Arbeitslosenquote, %"}
  lang_ca: {title: "Leistungsbilanz, % des BIP"}
  lang_ltrate: {title: "Langfristiger Zins, % p. a."}
  lang_stir: {title: "Kurzfristiger Zins, % p. a."}
  lang_credit: {title: "Kredite an den privaten Sektor, % des BIP"}
  lang_house: {title: "Reale Hauspreise, Index 1990=100"}

series:

  # ------------------------------------------------------------------
  # 1. Konjunktur Deutschland
  # ------------------------------------------------------------------
  - id: de_gdp_qoq
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_PRE, s_adj: SCA}
    title: BIP real, % gg. Vorquartal
    unit: "% gg. Vorquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp
    label: Vorquartal

  - id: de_gdp_yoy
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_SM, s_adj: SCA}
    title: BIP real, % gg. Vorjahresquartal
    unit: "% gg. Vorjahresquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp
    label: Vorjahresquartal

  - id: de_cpi
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.A00000.I20.A
    title: Verbraucherpreisindex (VPI) Deutschland
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi
    label: VPI gesamt
    note: Destatis-Daten über die Bundesbank-Zeitreihendatenbank; kein GENESIS-Zugang nötig.

  - id: de_cpi_yoy
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.A00000.VGJ.LV
    title: VPI, % gg. Vorjahresmonat (Inflationsrate)
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: VPI gesamt

  - id: de_cpi_energy
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.NRGY00.I20.A
    title: VPI Energie
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi
    label: Energie

  - id: de_cpi_energy_yoy
    block: inflation
    source: derived
    derive: {from: de_cpi_energy, op: yoy_pct}
    title: VPI Energie, % gg. Vorjahresmonat (berechnet)
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: Energie (berechnet)
    note: Aus dem Index berechnet; kann von der amtlich gerundeten Rate um 0,1 Punkte abweichen.

  - id: de_cpi_services
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.Y.VPI.C.SERV00.I20.A
    title: VPI Dienstleistungen (saisonbereinigt)
    unit: Index 2020=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: de_cpi
    label: Dienstleistungen (saisonbereinigt)
    note: Die Bundesbank führt diese Reihe nur saisonbereinigt.

  - id: de_cpi_land
    expand: {land: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16"]}
    block: inflation
    source: genesis
    key: "61111-0011"
    params:
      value_variable: PREIS1
      filters: {DLAND: "{land}"}
    title: "VPI {land_name}"
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    label: "{land_name}"
    chart: de_cpi_laender_index
    note: GENESIS-Zugang erforderlich (Secrets GENESIS_USER/GENESIS_PASSWORD). Merkmalscodes ungeprüft.

  - id: de_cpi_land_yoy
    expand: {land: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16"]}
    block: inflation
    source: derived
    derive: {from: "de_cpi_land_{land}", op: yoy_pct}
    title: "VPI {land_name}, % gg. Vorjahresmonat (berechnet)"
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    label: "{land_name}"
    chart: de_cpi_laender
    note: Aus dem Landes-VPI berechnet.

  - id: de_perceived_inflation
    expand: {geo: [DE, EU27_2020]}
    block: inflation
    source: eurostat
    key: ei_bsco_m
    params: {geo: "{geo}", indic: BS-PT-LY, s_adj: SA, unit: BAL}
    title: "Gefühlte Inflation {geo_name}: Preisentwicklung der letzten 12 Monate"
    unit: Saldo in Prozentpunkten
    frequency: M
    adjustment: saisonbereinigt
    chart: de_perceived
    label: "Gefühlt, {geo_name}"
    note: EU-Verbraucherumfrage (Frage Q5). Saldo aus Anteilen der Antworten 'stark gestiegen' bis 'gesunken'; kein Prozentwert der Teuerung.

  - id: de_expected_inflation
    expand: {geo: [DE, EU27_2020]}
    block: inflation
    source: eurostat
    key: ei_bsco_m
    params: {geo: "{geo}", indic: BS-PT-NY, s_adj: SA, unit: BAL}
    title: "Erwartete Inflation {geo_name}: Preisentwicklung der nächsten 12 Monate"
    unit: Saldo in Prozentpunkten
    frequency: M
    adjustment: saisonbereinigt
    chart: de_perceived
    label: "Erwartet, {geo_name}"
    note: EU-Verbraucherumfrage (Frage Q6). Saldo, kein Prozentwert.

  - id: de_hicp_yoy
    block: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: DE, unit: RCH_A, coicop18: TOTAL}
    title: HVPI, % gg. Vorjahresmonat
    note: Seit 2026 Klassifikation ECOICOP ver. 2 (Eurostat prc_hicp_minr); der alte Datensatz prc_hicp_manr endet 2025-12.
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: HVPI gesamt

  - id: de_hicp_core_yoy
    block: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: DE, unit: RCH_A, coicop18: TOT_X_NRG_FOOD}
    title: HVPI ohne Energie und Nahrungsmittel, % gg. Vorjahresmonat
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: HVPI Kern (ohne Energie, Nahrung)

  - id: de_gdp_contrib
    expand: {item: [P31_S14_S15, P3_S13, P51G, P52_P53, P6, P7]}
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: "{item}", unit: CON_PPCH_PRE, s_adj: SCA}
    title: "Wachstumsbeitrag {item_name}"
    unit: Pp gg. Vorquartal
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp_contrib
    label: "{item_name}"
    style: bar
    note: Beitrag zur Veränderung des realen BIP gegenüber dem Vorquartal in Prozentpunkten (Eurostat). Die Summe der Beiträge weicht wegen der Verkettung leicht von der BIP-Rate ab.

  - id: de_gdp_contrib_total
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_PRE, s_adj: SCA}
    title: BIP real, % gg. Vorquartal
    unit: "% gg. Vorquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp_contrib
    label: BIP real

  - id: de_unemp_ilo
    block: konjunktur
    source: eurostat
    key: une_rt_m
    params: {geo: DE, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    title: Erwerbslosenquote (ILO-Konzept)
    unit: "% der Erwerbspersonen"
    frequency: M
    adjustment: saisonbereinigt
    chart: de_labour_rate

  - id: de_employment
    block: konjunktur
    source: eurostat
    key: namq_10_pe
    params: {geo: DE, na_item: EMP_DC, unit: THS_PER, s_adj: SCA}
    title: Erwerbstätige (Inlandskonzept)
    unit: Tsd. Personen
    frequency: Q
    adjustment: saison- und kalenderbereinigt
    chart: de_employment

  - id: de_ip
    block: konjunktur
    source: eurostat
    key: sts_inpr_m
    params: {geo: DE, indic_bt: PRD, nace_r2: B-D, s_adj: SCA, unit: I21}
    title: Produktion in der Industrie (ohne Bau)
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt
    chart: de_production
    label: Produktion Industrie (Eurostat)

  - id: de_elec_hh
    block: energie
    source: eurostat
    key: nrg_pc_204
    params: {geo: DE, nrg_cons: KWH2500-4999, unit: KWH, tax: I_TAX, currency: EUR}
    title: Strompreis Haushalte (2500-5000 kWh/Jahr), inkl. Steuern
    unit: EUR/kWh
    frequency: S
    adjustment: nicht bereinigt
    chart: de_energy_prices_hh
    label: Strom
    start: "2007-01-01"

  - id: de_gas_hh
    block: energie
    source: eurostat
    key: nrg_pc_202
    params: {geo: DE, nrg_cons: GJ20-199, unit: KWH, tax: I_TAX, currency: EUR}
    title: Gaspreis Haushalte (20-200 GJ/Jahr), inkl. Steuern
    unit: EUR/kWh
    frequency: S
    adjustment: nicht bereinigt
    chart: de_energy_prices_hh
    label: Gas
    start: "2007-01-01"

  - id: de_elec_nonhh
    block: energie
    source: eurostat
    key: nrg_pc_205
    params: {geo: DE, nrg_cons: MWH500-1999, unit: KWH, tax: X_VAT, currency: EUR}
    title: Strompreis Nicht-Haushalte (500-2000 MWh/Jahr), ohne MwSt.
    unit: EUR/kWh
    frequency: S
    adjustment: nicht bereinigt
    chart: de_energy_prices_nonhh
    label: Strom
    start: "2007-01-01"

  - id: de_gas_nonhh
    block: energie
    source: eurostat
    key: nrg_pc_203
    params: {geo: DE, nrg_cons: GJ10000-99999, unit: KWH, tax: X_VAT, currency: EUR}
    title: Gaspreis Nicht-Haushalte (10.000-100.000 GJ/Jahr), ohne MwSt.
    unit: EUR/kWh
    frequency: S
    adjustment: nicht bereinigt
    chart: de_energy_prices_nonhh
    label: Gas
    start: "2007-01-01"

  - id: de_ppi_total
    block: energie
    source: eurostat
    key: sts_inppd_m
    params: {geo: DE, indic_bt: PRC_PRR_DOM, nace_r2: B-E36, s_adj: NSA, unit: I21}
    title: Erzeugerpreise Industrie (Inlandsabsatz), gesamt
    unit: Index 2021=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_ppi
    label: Industrie gesamt (Eurostat)

  - id: de_ppi_energy
    block: energie
    source: eurostat
    key: sts_inppd_m
    params: {geo: DE, indic_bt: PRC_PRR_DOM, nace_r2: MIG_NRG, s_adj: NSA, unit: I21}
    title: Erzeugerpreise Energie (Inlandsabsatz)
    unit: Index 2021=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_ppi
    label: Energie (Eurostat)

  - id: de_ppi_destatis
    block: energie
    source: genesis
    key: "61241-0002"
    params: {value_variable: PRE001, value_unit: "2021=100"}
    title: Erzeugerpreisindex gewerblicher Produkte (Inlandsabsatz)
    unit: Index 2021=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_ppi
    label: Gewerbliche Produkte gesamt (Destatis)
    note: GENESIS-Zugang erforderlich.

  - id: de_hicp_energy_yoy
    block: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: DE, unit: RCH_A, coicop18: NRG}
    title: HVPI Energie, % gg. Vorjahresmonat
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: HVPI Energie

  - id: de_energy_gae
    block: energie
    source: eurostat
    key: nrg_bal_c
    params: {geo: DE, nrg_bal: GAE, siec: TOTAL, unit: KTOE}
    title: Bruttoenergieverbrauch (Gross available energy)
    unit: Tsd. t RÖE
    frequency: A
    adjustment: nicht bereinigt
    chart: de_energy_use
    label: Bruttoenergieverbrauch

  - id: de_energy_fec
    block: energie
    source: eurostat
    key: nrg_bal_c
    params: {geo: DE, nrg_bal: FC_E, siec: TOTAL, unit: KTOE}
    title: Endenergieverbrauch (energetisch)
    unit: Tsd. t RÖE
    frequency: A
    adjustment: nicht bereinigt
    chart: de_energy_use
    label: Endenergieverbrauch

  # ------------------------------------------------------------------
  # 3. Finanzen und Zinsen
  # ------------------------------------------------------------------
  - id: ecb_dfr
    block: finanzen
    source: ecb
    key: FM/D.U2.EUR.4F.KR.DFR.LEV
    title: EZB-Einlagesatz
    unit: "% p. a."
    frequency: D
    adjustment: nicht bereinigt
    chart: ecb_rates
    label: Einlagesatz
    style: step

  - id: ecb_mro
    block: finanzen
    source: ecb
    key: FM/D.U2.EUR.4F.KR.MRR_FR.LEV
    title: EZB-Hauptrefinanzierungssatz (Festsatz)
    unit: "% p. a."
    frequency: D
    adjustment: nicht bereinigt
    chart: ecb_rates
    label: Hauptrefinanzierungssatz
    style: step
    note: Festsatz erst seit Oktober 2008; davor Zinstender mit Mindestbietungssatz.

  - id: ecb_mlf
    block: finanzen
    source: ecb
    key: FM/D.U2.EUR.4F.KR.MLFR.LEV
    title: EZB-Spitzenrefinanzierungssatz
    unit: "% p. a."
    frequency: D
    adjustment: nicht bereinigt
    chart: ecb_rates
    label: Spitzenrefinanzierungssatz
    style: step

  - id: de_bund10_bbk
    block: finanzen
    source: bundesbank
    key: BBSIS/M.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A
    title: Rendite Bundeswertpapiere, Restlaufzeit 10 Jahre (Zinsstruktur)
    unit: "% p. a."
    frequency: M
    adjustment: nicht bereinigt
    chart: de_yields
    label: 10 Jahre (Bundesbank)

  - id: de_bund2_bbk
    block: finanzen
    source: bundesbank
    key: BBSIS/M.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A
    title: Rendite Bundeswertpapiere, Restlaufzeit 2 Jahre (Zinsstruktur)
    unit: "% p. a."
    frequency: M
    adjustment: nicht bereinigt
    chart: de_yields
    label: 2 Jahre (Bundesbank)

  - id: de_ltir_ecb
    block: finanzen
    source: ecb
    key: IRS/M.DE.L.L40.CI.0000.EUR.N.Z
    title: Langfristiger Zinssatz Deutschland (Konvergenzkriterium, 10 Jahre)
    unit: "% p. a."
    frequency: M
    adjustment: nicht bereinigt
    chart: de_yields
    label: 10 Jahre, Konvergenzzins (EZB)

  - id: de_loans_nfc
    block: finanzen
    source: ecb
    key: BSI/M.DE.N.A.A20.A.1.U2.2240.Z01.E
    title: Kredite deutscher MFIs an nichtfinanzielle Unternehmen, Bestand
    params: {scale: 0.001}
    unit: "€Mrd."
    frequency: M
    adjustment: nicht bereinigt
    chart: de_loans_stock
    label: Unternehmen

  - id: de_loans_hh
    block: finanzen
    source: ecb
    key: BSI/M.DE.N.A.A20.A.1.U2.2250.Z01.E
    title: Kredite deutscher MFIs an private Haushalte, Bestand
    params: {scale: 0.001}
    unit: "€Mrd."
    frequency: M
