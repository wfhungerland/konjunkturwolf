# Reihen-Katalog von konjunkturwolf
#
# Neue Reihe = ein Eintrag unter "series". Pflichtfelder:
#   id, source, key (ausser bei source: derived), title, unit, frequency,
#   adjustment, block
# Optionale Felder:
#   params      Filter/Abfrageparameter der Quelle (Eurostat: Dimensionen,
#               GENESIS: value_variable, filters, query)
#   link        Direktlink zur Reihe auf der Website der Quelle
#               (fehlt er, wird ein Standardlink erzeugt)
#   chart       Diagramm-ID aus "charts" (mehrere Reihen in einem Diagramm)
#   label       Legendenbeschriftung im Diagramm (Standard: title)
#   style       line | step
#   start       Beginn als ISO-Datum (Standard: defaults.start)
#   note        Hinweis, erscheint im Excel-Blatt Quellen
#   expand      Vervielfacht den Eintrag, z. B. {geo: [DE, FR]};
#               Platzhalter {geo} und {geo_name} in allen Textfeldern
#   derive      Abgeleitete Reihe, z. B. {from: de_cpi, op: yoy_pct}
#
# Frequenzen: D (täglich), M (monatlich), Q (quartalsweise),
#             S (halbjährlich), A (jährlich)
# Quellen:    ecb, bundesbank, eurostat, genesis, derived

defaults:
  start: "2000-01-01"

blocks:
  - id: inflation
    title: Inflation
    sheet: Inflation
  - id: konjunktur
    title: Konjunktur Deutschland
    sheet: Konjunktur DE
  - id: energie
    title: Energie und Preise
    sheet: Energie & Preise
  - id: finanzen
    title: Finanzen und Zinsen
    sheet: Finanzen & Zinsen
  - id: eu
    title: EU-Vergleich
    sheet: EU-Vergleich
  - id: lang
    title: Langfristig (seit 1870)
    sheet: Langfristig
    history: true

# Vergleichsdiagramme: Fokusland hervorgehoben, Vergleichsländer als graue Spanne (Minimum bis Maximum)
comparison:
  focus: [DE, DEU]
  peers: [FR, IT, ES, NL, PL, FRA, ITA, ESP, NLD, POL, GBR, USA]

geo_names:
  DE: Deutschland
  FR: Frankreich
  IT: Italien
  ES: Spanien
  NL: Niederlande
  PL: Polen
  EU27_2020: EU27
  DEU: Deutschland
  FRA: Frankreich
  ITA: Italien
  ESP: Spanien
  NLD: Niederlande
  POL: Polen
  GBR: Vereinigtes Königreich
  USA: USA

# Webseite: je Kernindikator links der lange Rand (seit 1870), rechts der aktuelle Rand (5 Jahre)
panels:
  - id: inflation
    title: Inflation
    question: "Ist die Inflation heute hoch, gemessen an 150 Jahren und an den Nachbarn? Dazu {abb}."
    left: {chart: lang_infl, title: "Inflation seit 1870, % gg. Vorjahr", decimals: 1}
    right: {chart: eu_hicp, title: "Inflation aktuell (HVPI), % gg. Vorjahresmonat", decimals: 1}
  - id: wachstum
    title: Wachstum
    question: "Wächst Deutschland heute langsamer als früher und als die Nachbarn? Dazu {abb}."
    left: {chart: lang_growth, title: "Reales BIP seit 1870, % gg. Vorjahr"}
    right: {chart: eu_gdp, title: "Reales BIP aktuell, % gg. Vorjahresquartal", decimals: 1}
  - id: arbeit
    title: Arbeitslosigkeit
    question: "Ist die Arbeitslosigkeit im langen Vergleich niedrig? Dazu {abb}."
    left: {chart: lang_unemp, title: "Arbeitslosenquote seit 1870, %", note: "Frühe Jahre beruhen auf anderen Erhebungen (z. B. Gewerkschaftsstatistiken) und sind nur grob mit der heutigen ILO-Quote vergleichbar; seit 2010 stimmt die Reihe mit der ILO-Quote überein."}
    right: {chart: eu_unemp, title: "Erwerbslosenquote (ILO) aktuell, %", decimals: 1}
  - id: zinsen
    title: Zinsen
    question: "Sind die Zinsen nach der Nullzinsphase wieder normal? Dazu {abb}."
    left: {chart: lang_ltrate, title: "Rendite Staatsanleihen 10 Jahre seit 1870, % p. a."}
    right: {chart: eu_ltrate, title: "Rendite Staatsanleihen 10 Jahre aktuell, % p. a.", decimals: 1}
  - id: krise
    title: Industrie in der Krise
    question: "Wie tief und wie lang ist der jüngste Rückgang der Industrie, verglichen mit der Weltwirtschaftskrise und der Finanzkrise? Dazu {abb}."
    left:
      title: "Industrieproduktion nach dem Hoch, Hoch = 100"
      years: 8
      episodes:
        - {series: nber_ip_2537, window: [1927, 1930], label: Weltwirtschaftskrise}
        - {series: eu_ip_de, window: [2007, 2008], label: Finanzkrise}
        - {series: eu_ip_de, window: [2016, 2019], label: Heute}
    right: {chart: eu_ip, title: "Industrieproduktion aktuell, Index 2021 = 100", decimals: 0}
  - id: preise
    title: Erzeugerpreise
    question: "Schwanken die Preise heute stärker als im Kaiserreich? Großhandelspreise damals, Erzeugerpreise heute. Dazu {abb}."
    facts: [volatility]
    left: {chart: nber_wpi_yoy, title: "Großhandelspreise Hamburg 1880 bis 1914, % gg. Vorjahresmonat", note: "Der Hamburger Index enthält vor allem Rohstoffe und Lebensmittel, die Erzeugerpreise heute gewerbliche Produkte. Beide reagieren stark auf Rohstoffpreise, sind aber nicht deckungsgleich."}
    right: {chart: eu_ppi_yoy, title: "Erzeugerpreise Industrie aktuell, % gg. Vorjahresmonat", decimals: 1}
  - id: handelsgewinne
    title: Handelsgewinne
    question: "Wie viel Realeinkommen verdankt Deutschland dem Außenhandel, heute und in der ersten Globalisierung? Dazu {abb}."
    left: {chart: lang_acr, title: "Handelsgewinne seit 1827 (ACR, θ = 5), % des Realeinkommens", note: "Arkolakis, Costinot und Rodríguez-Clare (2012): Gewinn gegenüber Autarkie = 1 − λ^(1/θ), λ = Anteil der Inlandsausgaben, die auf heimische Güter entfallen; aus TRADHIST-Gesamtexporten und -importen (Waren) und BIP. θ = 5 als mittlerer Literaturwert; mit θ = 4 sind die Gewinne höher, mit θ = 8 niedriger (dünne Linien). Bis 1870 Zollverein, 1950 bis 1990 Bundesrepublik."}
    right: {chart: eu_acr, title: "Handelsgewinne aktuell (ACR, θ = 5), % des Realeinkommens", decimals: 1, note: "Aus Exporten und Importen von Waren und Dienstleistungen in % des BIP (Eurostat); die lange Reihe enthält nur Waren, daher liegt das Niveau höher."}
  - id: gravitation
    title: Gravitation
    question: "Wie haben sich Handelskosten und Handelsbeziehungen Deutschlands seit 1870 verändert? Dazu {abb}."
    charts:
      - {chart: grav_novy, note: "Novy (2013): Zolläquivalent = ((x_ii · x_jj) / (x_ij · x_ji))^(1/(2θ)) − 1 mit θ = 8; x_ij bilaterale Ströme, x_ii Binnenhandel als BIP minus Exporte. Misst alle Handelskosten (Transport, Zölle, Sprache, Politik) relativ zum Binnenhandel."}
      - {chart: grav_resid, note: "Tatsächliche deutsche Exporte geteilt durch die Vorhersage einer PPML-Gravitationsgleichung je Jahr (Exporteur- und Importeur-Effekte, Distanz, Grenze, Sprache, Kolonialbeziehung). Über 1: mehr Handel als erwartet."}
      - {chart: grav_mrt, note: "Aus den Exporteur- und Importeur-Effekten der PPML-Schätzung je Jahr (Fally 2015), θ = 5, relativ zu den USA, weil die Effekte nur bis auf eine Normierung bestimmt sind. Höher: Deutschland ist relativ zu den USA schlechter an den Weltmarkt angebunden. Vorsichtig deuten."}
      - {chart: grav_dist, note: "Koeffizient der logarithmierten Distanz in der PPML-Schätzung je Jahr (alle Länderpaare in TRADHIST)."}
      - {chart: grav_share, note: "Anteil der Partner an den deutschen Exporten laut den bilateralen Strömen in TRADHIST."}
  - id: offenheit
    title: Offenheit
    question: "Wie stark hängt Deutschland heute am Außenhandel, verglichen mit der ersten Globalisierung vor 1914 und mit den Nachbarn? Dazu {abb}."
    left: {chart: lang_open, title: "Exporte plus Importe seit 1827, % des BIP", note: "Hellblau: Fouquin und Hugot (2016), Summe der bilateralen Ströme, bis 1870 Zollverein. Liegt unter dem JST-Niveau, weil nicht aller Handel erfasst ist; daher nicht angeschlossen."}
    right: {chart: eu_open, title: "Exporte plus Importe aktuell, % des BIP", decimals: 0}
  - id: zinsstruktur
    title: Zinsabstand
    question: "Ist der Abstand zwischen langen und kurzen Zinsen ungewöhnlich? Ein negativer Abstand gilt vor allem in den USA als Rezessionssignal. Dazu {abb}."
    left: {chart: lang_term, title: "Zinsabstand lang minus kurz seit 1870, Pp"}
    right: {chart: now_term, title: "Zinsabstand aktuell, Pp", decimals: 1}
  - id: spreads
    title: Spreads
    question: "Wie viel mehr Zins zahlen die Nachbarn als Deutschland? Steigende Abstände zeigen Stress im Euroraum. Dazu {abb}."
    left: {chart: lang_spread, title: "Renditeabstand zu Deutschland seit 1870, Pp"}
    right: {chart: eu_spread, title: "Renditeabstand zu Deutschland aktuell, Pp", decimals: 1, note: "Polen: Anleihen in Zloty, der Abstand enthält auch Währungs- und Inflationserwartungen."}

# Nur diese Länder erscheinen in den Panels (links und rechts dieselbe Gruppe)
panel_members: [DE, FR, IT, ES, NL, PL, DEU, FRA, ITA, ESP, NLD, POL]

names:
  item:
    P31_S14_S15: Private Konsumausgaben
    P3_S13: Staatskonsum
    P51G: Bruttoanlageinvestitionen
    P52_P53: Vorratsveränderungen
    P6: Exporte
    P7: Importe
  land:
    "01": Schleswig-Holstein
    "02": Hamburg
    "03": Niedersachsen
    "04": Bremen
    "05": Nordrhein-Westfalen
    "06": Hessen
    "07": Rheinland-Pfalz
    "08": Baden-Württemberg
    "09": Bayern
    "10": Saarland
    "11": Berlin
    "12": Brandenburg
    "13": Mecklenburg-Vorpommern
    "14": Sachsen
    "15": Sachsen-Anhalt
    "16": Thüringen

charts:
  de_gdp: {title: "BIP real, Veränderung in %"}
  de_gdp_contrib: {title: "Wachstumsbeiträge zum realen BIP gg. Vorquartal, Prozentpunkte", kind: stacked}
  de_cpi: {title: "Verbraucherpreisindex (VPI), 2020=100"}
  de_cpi_rate: {title: "VPI, % gg. Vorjahresmonat", decimals: 1}
  de_cpi_laender: {title: "VPI der Bundesländer, % gg. Vorjahresmonat", decimals: 1}
  de_cpi_laender_index: {title: "VPI der Bundesländer, 2020=100"}
  de_perceived: {title: "Gefühlte und erwartete Inflation (Verbraucherumfrage)"}
  de_labour_rate: {title: "Arbeitslosenquote (ILO)"}
  de_employment: {title: "Erwerbstätige (Inland)"}
  de_production: {title: "Industrieproduktion und Auftragseingang, Index"}
  de_energy_prices_hh: {title: "Strom- und Gaspreise Haushalte"}
  de_energy_prices_nonhh: {title: "Strom- und Gaspreise Nicht-Haushalte"}
  de_ppi: {title: "Erzeugerpreise gewerblicher Produkte, Index"}
  de_energy_use: {title: "Energieverbrauch Deutschland"}
  ecb_rates: {title: "EZB-Leitzinsen"}
  de_yields: {title: "Renditen deutscher Bundeswertpapiere"}
  de_loans_stock: {title: "Kredite an Unternehmen und Haushalte, Bestand, €Mrd."}
  de_loans_growth: {title: "Kredite an Unternehmen und Haushalte, Wachstum"}
  fx_major: {title: "Wechselkurse: USD, GBP, CHF je Euro"}
  fx_asia: {title: "Wechselkurse: JPY, CNY je Euro"}
  eu_gdp: {title: "BIP real, % gg. Vorjahresquartal"}
  eu_hicp: {title: "HVPI-Inflationsrate, % gg. Vorjahresmonat", decimals: 1}
  eu_unemp: {title: "Arbeitslosenquote (ILO), %"}
  eu_elec_hh: {title: "Strompreise Haushalte, EUR/kWh"}
  eu_elec_nonhh: {title: "Strompreise Nicht-Haushalte, EUR/kWh"}
  lang_term: {title: "Zinsabstand lang minus kurz, Pp", y_min: -10, y_max: 10, decimals: 1}
  now_term: {title: "Zinsabstand 10 Jahre minus Tagesgeld, Pp", decimals: 1}
  lang_spread: {title: "Renditeabstand zu Deutschland, Pp", y_min: -5, y_max: 15, decimals: 1}
  eu_spread: {title: "Renditeabstand zu Deutschland (10 Jahre), Pp", decimals: 1}
  lang_open: {title: "Exporte plus Importe, % des BIP", decimals: 0}
  eu_open: {title: "Exporte plus Importe, % des BIP", decimals: 0}
  eu_ip: {title: "Industrieproduktion, Index 2021 = 100", decimals: 0}
  eu_ppi_yoy: {title: "Erzeugerpreise Industrie, % gg. Vorjahresmonat", decimals: 1}
  nber_wpi_yoy: {title: "Großhandelspreise Hamburg, % gg. Vorjahresmonat", decimals: 1, y_min: -20, y_max: 30}
  lang_acr: {title: "Handelsgewinne nach ACR, % des Realeinkommens", decimals: 1}
  eu_acr: {title: "Handelsgewinne nach ACR, % des Realeinkommens", decimals: 1}
  grav_novy: {title: "Handelskosten Deutschlands nach Novy, Zolläquivalent in %", decimals: 0}
  grav_mrt: {title: "Multilaterale Widerstände Deutschlands relativ zu den USA, log-Punkte", decimals: 2}
  grav_dist: {title: "Distanzelastizität des Welthandels (PPML)", decimals: 2}
  grav_share: {title: "Anteil an den deutschen Exporten, %", decimals: 0}
  grav_resid: {title: "Deutsche Exporte im Verhältnis zur Gravitationserwartung", decimals: 1}
  eu_ltrate: {title: "Rendite Staatsanleihen 10 Jahre (Konvergenzzins), % p. a."}
  lang_infl: {title: "Inflation, % gg. Vorjahr", y_min: -20, y_max: 40, decimals: 1}
  lang_growth: {title: "Reales BIP, % gg. Vorjahr", y_min: -20, y_max: 20}
  lang_debt: {title: "Staatsschulden, % des BIP"}
  lang_unemp: {title: "Arbeitslosenquote, %"}
  lang_ca: {title: "Leistungsbilanz, % des BIP"}
  lang_ltrate: {title: "Langfristiger Zins, % p. a."}
  lang_stir: {title: "Kurzfristiger Zins, % p. a."}
  lang_credit: {title: "Kredite an den privaten Sektor, % des BIP"}
  lang_house: {title: "Reale Hauspreise, Index 1990=100"}

series:

  # ------------------------------------------------------------------
  # 1. Konjunktur Deutschland
  # ------------------------------------------------------------------
  - id: de_gdp_qoq
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_PRE, s_adj: SCA}
    title: BIP real, % gg. Vorquartal
    unit: "% gg. Vorquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp
    label: Vorquartal

  - id: de_gdp_yoy
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_SM, s_adj: SCA}
    title: BIP real, % gg. Vorjahresquartal
    unit: "% gg. Vorjahresquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp
    label: Vorjahresquartal

  - id: de_cpi
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.A00000.I20.A
    title: Verbraucherpreisindex (VPI) Deutschland
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi
    label: VPI gesamt
    note: Destatis-Daten über die Bundesbank-Zeitreihendatenbank; kein GENESIS-Zugang nötig.

  - id: de_cpi_yoy
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.A00000.VGJ.LV
    title: VPI, % gg. Vorjahresmonat (Inflationsrate)
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: VPI gesamt

  - id: de_cpi_energy
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.NRGY00.I20.A
    title: VPI Energie
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi
    label: Energie

  - id: de_cpi_energy_yoy
    block: inflation
    source: derived
    derive: {from: de_cpi_energy, op: yoy_pct}
    title: VPI Energie, % gg. Vorjahresmonat (berechnet)
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: Energie (berechnet)
    note: Aus dem Index berechnet; kann von der amtlich gerundeten Rate um 0,1 Punkte abweichen.

  - id: de_cpi_services
    block: inflation
    source: bundesbank
    key: BBDP1/M.DE.Y.VPI.C.SERV00.I20.A
    title: VPI Dienstleistungen (saisonbereinigt)
    unit: Index 2020=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: de_cpi
    label: Dienstleistungen (saisonbereinigt)
    note: Die Bundesbank führt diese Reihe nur saisonbereinigt.

  - id: de_cpi_land
    expand: {land: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16"]}
    block: inflation
    source: genesis
    key: "61111-0011"
    params:
      value_variable: PREIS1
      filters: {DLAND: "{land}"}
    title: "VPI {land_name}"
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    label: "{land_name}"
    chart: de_cpi_laender_index
    note: GENESIS-Zugang erforderlich (Secrets GENESIS_USER/GENESIS_PASSWORD). Merkmalscodes ungeprüft.

  - id: de_cpi_land_yoy
    expand: {land: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16"]}
    block: inflation
    source: derived
    derive: {from: "de_cpi_land_{land}", op: yoy_pct}
    title: "VPI {land_name}, % gg. Vorjahresmonat (berechnet)"
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    label: "{land_name}"
    chart: de_cpi_laender
    note: Aus dem Landes-VPI berechnet.

  - id: de_perceived_inflation
    expand: {geo: [DE, EU27_2020]}
    block: inflation
    source: eurostat
    key: ei_bsco_m
    params: {geo: "{geo}", indic: BS-PT-LY, s_adj: SA, unit: BAL}
    title: "Gefühlte Inflation {geo_name}: Preisentwicklung der letzten 12 Monate"
    unit: Saldo in Prozentpunkten
    frequency: M
    adjustment: saisonbereinigt
    chart: de_perceived
    label: "Gefühlt, {geo_name}"
    note: EU-Verbraucherumfrage (Frage Q5). Saldo aus Anteilen der Antworten 'stark gestiegen' bis 'gesunken'; kein Prozentwert der Teuerung.

  - id: de_expected_inflation
    expand: {geo: [DE, EU27_2020]}
    block: inflation
    source: eurostat
    key: ei_bsco_m
    params: {geo: "{geo}", indic: BS-PT-NY, s_adj: SA, unit: BAL}
    title: "Erwartete Inflation {geo_name}: Preisentwicklung der nächsten 12 Monate"
    unit: Saldo in Prozentpunkten
    frequency: M
    adjustment: saisonbereinigt
    chart: de_perceived
    label: "Erwartet, {geo_name}"
    note: EU-Verbraucherumfrage (Frage Q6). Saldo, kein Prozentwert.

  - id: de_hicp_yoy
    block: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: DE, unit: RCH_A, coicop18: TOTAL}
    title: HVPI, % gg. Vorjahresmonat
    note: Seit 2026 Klassifikation ECOICOP ver. 2 (Eurostat prc_hicp_minr); der alte Datensatz prc_hicp_manr endet 2025-12.
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: HVPI gesamt

  - id: de_hicp_core_yoy
    block: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: DE, unit: RCH_A, coicop18: TOT_X_NRG_FOOD}
    title: HVPI ohne Energie und Nahrungsmittel, % gg. Vorjahresmonat
    unit: "% gg. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: de_cpi_rate
    label: HVPI Kern (ohne Energie, Nahrung)

  - id: de_gdp_contrib
    expand: {item: [P31_S14_S15, P3_S13, P51G, P52_P53, P6, P7]}
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: "{item}", unit: CON_PPCH_PRE, s_adj: SCA}
    title: "Wachstumsbeitrag {item_name}"
    unit: Pp gg. Vorquartal
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp_contrib
    label: "{item_name}"
    style: bar
    note: Beitrag zur Veränderung des realen BIP gegenüber dem Vorquartal in Prozentpunkten (Eurostat). Die Summe der Beiträge weicht wegen der Verkettung leicht von der BIP-Rate ab.

  - id: de_gdp_contrib_total
    block: konjunktur
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_PRE, s_adj: SCA}
    title: BIP real, % gg. Vorquartal
    unit: "% gg. Vorquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: de_gdp_contrib
    label: BIP real

  - id: de_unemp_ilo
    block: konjunktur
    source: eurostat
    key: une_rt_m
    params: {geo: DE, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    title: Erwerbslosenquote (ILO-Konzept)
    unit: "% der Erwerbspersonen"
    frequency: M
    adjustment: saisonbereinigt
    chart: de_labour_rate

  - id: de_employment
    block: konjunktur
    source: eurostat
    key: namq_10_pe
    params: {geo: DE, na_item: EMP_DC, unit: THS_PER, s_adj: SCA}
    title: Erwerbstätige (Inlandskonzept)
    unit: Tsd. Personen
    frequency: Q
    adjustment: saison- und kalenderbereinigt
    chart: de_employment

  - id: de_ip
    block: konjunktur
    source: eurostat
    key: sts_inpr_m
    params: {geo: DE, indic_bt: PRD, nace_r2: B-D, s_adj: SCA, unit: I21}
    title: Produktion in der Industrie (ohne Bau)
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt
    chart: de_production
    label: Produktion Industrie (Eurostat)

  - id: de_elec_hh
    block: energie
    source: eurostat
